<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALC Iran - Study Plan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="logo">SALC Iran</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="courses.html">Courses</a>
        <a href="teachers.html">Learning Guides</a>
        <a href="events.html">Events</a>
        <a href="resources.html">Resources</a>
    </nav>
</header>

<main>

    <section class="hero">
        <h1>Request a Study Plan</h1>

        <p>
            Tell us about your language learning goals
            and get guidance from a SALC Learning Guide.
        </p>
    </section>

    <section class="learning-areas">

        <div class="card">

            <h2>Your Learning Goals</h2>

            <form>

                <p>
                    <label for="name">Name</label><br>
                    <input type="text" id="name" name="entry.548854218">
                </p>

                <p>
                    <label for="language">Language</label><br>
                    <select id="language" name="entry.1256885578">
                        <option>English</option>
                        <option>French</option>
                    </select>
                </p>

                <p>
                    <label for="level">Current Level</label><br>
                    <select id="level" name="entry.1443090916">
                        <option>A1</option>
                        <option>A2</option>
                        <option>B1</option>
                        <option>B2</option>
                    </select>
                </p>

                <p>
                    <label for="goal">What is your main goal?</label><br>
                    <textarea id="goal" name="entry.2111705439" rows="5"></textarea>
                </p>

                <p>
                    <label for="time">How much time can you study each week?</label><br>
                   <input type="text" id="time" name="entry.2130566068">
                </p>

                <button type="submit">Submit Request</button>

            <form action="https://docs.google.com/forms/d/e/1FAIpQLSfNu8GwnVI4BPaGHqh9O_7O9eNPiu9LM2YlaVAuTESIuvnCAg/formResponse" method="POST">

        </div>

    </section>

</main>

<footer>
    <p>© 2026 SALC Iran</p>
</footer>

</body>
</html>
